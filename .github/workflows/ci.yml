name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate evidence records
        run: python -m dprk_fightback validate
      - name: Build package
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed CLI and bundled data
        working-directory: ${{ runner.temp }}
        run: |
          dprk-fightback validate
          dprk-fightback fees --service exch
